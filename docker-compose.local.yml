services:
  postgres:
    container_name: quant-postgres
    image: postgres:16-alpine
    mem_limit: 768m
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      TZ: UTC
    volumes:
      - quant_local_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  quant-collector:
    container_name: quant-collector
    image: ${QUANT_IMAGE_TAG:-quant-phase7:phase6-local}
    command: ["python", "-m", "quant_phase1.entrypoints.collector"]
    environment:
      TRADING_MODE: paper
      QUANT_COLLECTOR_READINESS_SYMBOLS: "${QUANT_COLLECTOR_READINESS_SYMBOLS:-BTCUSDT,ETHUSDT}"
      PHASE2_ENABLED: "1"
      PHASE3_ENABLED: "1"
      PHASE4_ENABLED: "1"
      PHASE5_ENABLED: "1"
      PHASE6_ENABLED: "1"
      PHASE6_INGESTION_INTERVAL_SECONDS: "300"
      PHASE7_ENABLED: "${PHASE7_ENABLED:-0}"
      PHASE7_BITCOIN_RPC_ENABLED: "${PHASE7_BITCOIN_RPC_ENABLED:-0}"
      PHASE7_BITCOIN_RPC_URL: "${PHASE7_BITCOIN_RPC_URL:-}"
      PHASE7_BITCOIN_RPC_AUTH_MODE: "${PHASE7_BITCOIN_RPC_AUTH_MODE:-none}"
      PHASE7_BITCOIN_RPC_USERNAME: "${PHASE7_BITCOIN_RPC_USERNAME:-}"
      PHASE7_BITCOIN_RPC_PASSWORD: "${PHASE7_BITCOIN_RPC_PASSWORD:-}"
      PHASE7_BITCOIN_RPC_TIMEOUT_SECONDS: "${PHASE7_BITCOIN_RPC_TIMEOUT_SECONDS:-8}"
      PHASE7_BITCOIN_RPC_REQUESTS_PER_SECOND: "${PHASE7_BITCOIN_RPC_REQUESTS_PER_SECOND:-1}"
      PHASE7_BITCOIN_RPC_MAX_CONCURRENCY: "${PHASE7_BITCOIN_RPC_MAX_CONCURRENCY:-1}"
      PHASE7_ETHEREUM_RPC_ENABLED: "${PHASE7_ETHEREUM_RPC_ENABLED:-0}"
      PHASE7_ETHEREUM_RPC_URL: "${PHASE7_ETHEREUM_RPC_URL:-}"
      PHASE7_ETHEREUM_RPC_AUTH_MODE: "${PHASE7_ETHEREUM_RPC_AUTH_MODE:-none}"
      PHASE7_ETHEREUM_RPC_TIMEOUT_SECONDS: "${PHASE7_ETHEREUM_RPC_TIMEOUT_SECONDS:-8}"
      PHASE7_ETHEREUM_RPC_REQUESTS_PER_SECOND: "${PHASE7_ETHEREUM_RPC_REQUESTS_PER_SECOND:-1}"
      PHASE7_ETHEREUM_RPC_MAX_CONCURRENCY: "${PHASE7_ETHEREUM_RPC_MAX_CONCURRENCY:-1}"
      PHASE7_CONTEXT_INTERVAL_SECONDS: "${PHASE7_CONTEXT_INTERVAL_SECONDS:-60}"
      PHASE7_CONTEXT_LOOKBACK_HOURS: "${PHASE7_CONTEXT_LOOKBACK_HOURS:-4}"
      PHASE7_CONTEXT_WINDOW_BATCH: "${PHASE7_CONTEXT_WINDOW_BATCH:-16}"
      PHASE7_ADDRESS_LABELS_PATH: "${PHASE7_ADDRESS_LABELS_PATH:-}"
      PHASE7_WHALE_THRESHOLDS_PATH: "${PHASE7_WHALE_THRESHOLDS_PATH:-}"
      PHASE8_OPTIONS_ENABLED: "${PHASE8_OPTIONS_ENABLED:-0}"
      PHASE8_OPTIONS_MAX_EXPIRY_DAYS: "${PHASE8_OPTIONS_MAX_EXPIRY_DAYS:-90}"
      PHASE8_OPTIONS_MAX_ABS_MONEYNESS_PCT: "${PHASE8_OPTIONS_MAX_ABS_MONEYNESS_PCT:-5.0}"
      PHASE8_OPTIONS_MAX_TICKER_INSTRUMENTS_PER_CURRENCY: "${PHASE8_OPTIONS_MAX_TICKER_INSTRUMENTS_PER_CURRENCY:-64}"
      PHASE8_OPTIONS_MAX_TICKER_SUBSCRIPTIONS_TOTAL: "${PHASE8_OPTIONS_MAX_TICKER_SUBSCRIPTIONS_TOTAL:-128}"
      PHASE8_OPTIONS_MAX_FULL_CHAIN_RECORDS_PER_UNDERLYING: "${PHASE8_OPTIONS_MAX_FULL_CHAIN_RECORDS_PER_UNDERLYING:-2048}"
      PHASE8_OPTIONS_MAX_FULL_CHAIN_RECORDS_TOTAL: "${PHASE8_OPTIONS_MAX_FULL_CHAIN_RECORDS_TOTAL:-4096}"
      PHASE8_OPTIONS_MAX_MARKPRICE_CHANNELS_TOTAL: "${PHASE8_OPTIONS_MAX_MARKPRICE_CHANNELS_TOTAL:-4}"
      PHASE8_OPTIONS_INSTRUMENT_REFRESH_SECONDS: "${PHASE8_OPTIONS_INSTRUMENT_REFRESH_SECONDS:-86400}"
      PHASE8_OPTIONS_RESEED_AFTER_OUTAGE_SECONDS: "${PHASE8_OPTIONS_RESEED_AFTER_OUTAGE_SECONDS:-300}"
      PHASE8_OPTIONS_CHAIN_SNAPSHOT_INTERVAL_SECONDS: "${PHASE8_OPTIONS_CHAIN_SNAPSHOT_INTERVAL_SECONDS:-3600}"
      PHASE8_OPTIONS_MARKPRICE_SNAPSHOT_INTERVAL_SECONDS: "${PHASE8_OPTIONS_MARKPRICE_SNAPSHOT_INTERVAL_SECONDS:-900}"
      PHASE8_OPTIONS_TICKER_SNAPSHOT_INTERVAL_SECONDS: "${PHASE8_OPTIONS_TICKER_SNAPSHOT_INTERVAL_SECONDS:-900}"
      PHASE8_OPTIONS_CONTEXT_INTERVAL_SECONDS: "${PHASE8_OPTIONS_CONTEXT_INTERVAL_SECONDS:-900}"
      PHASE8_OPTIONS_MAX_REST_RESPONSE_BYTES: "${PHASE8_OPTIONS_MAX_REST_RESPONSE_BYTES:-8388608}"
      PHASE8_OPTIONS_REST_TIMEOUT_SECONDS: "${PHASE8_OPTIONS_REST_TIMEOUT_SECONDS:-10}"
      PHASE8_OPTIONS_REST_MIN_INTERVAL_SECONDS: "${PHASE8_OPTIONS_REST_MIN_INTERVAL_SECONDS:-1.25}"
      PHASE8_OPTIONS_REST_MAX_COOLDOWN_SECONDS: "${PHASE8_OPTIONS_REST_MAX_COOLDOWN_SECONDS:-300}"
      PHASE8_OPTIONS_REST_MAX_ATTEMPTS: "${PHASE8_OPTIONS_REST_MAX_ATTEMPTS:-3}"
      PHASE8_OPTIONS_WS_QUEUE_MAX_MESSAGES: "${PHASE8_OPTIONS_WS_QUEUE_MAX_MESSAGES:-256}"
      PHASE8_OPTIONS_WS_MAX_QUEUED_BYTES: "${PHASE8_OPTIONS_WS_MAX_QUEUED_BYTES:-16777216}"
      PHASE8_OPTIONS_WS_MAX_MESSAGE_BYTES: "${PHASE8_OPTIONS_WS_MAX_MESSAGE_BYTES:-1048576}"
      PHASE8_OPTIONS_WS_SUBSCRIBE_MIN_INTERVAL_SECONDS: "${PHASE8_OPTIONS_WS_SUBSCRIBE_MIN_INTERVAL_SECONDS:-0.35}"
      PHASE8_OPTIONS_WS_SUBSCRIBE_BATCH_SIZE: "${PHASE8_OPTIONS_WS_SUBSCRIBE_BATCH_SIZE:-32}"
      PHASE8_OPTIONS_WS_MAX_RECONNECT_ATTEMPTS: "${PHASE8_OPTIONS_WS_MAX_RECONNECT_ATTEMPTS:-8}"
      PHASE8_OPTIONS_WS_RECONNECT_MAX_DELAY_SECONDS: "${PHASE8_OPTIONS_WS_RECONNECT_MAX_DELAY_SECONDS:-60}"
      PHASE8_OPTIONS_SHUTDOWN_TIMEOUT_SECONDS: "${PHASE8_OPTIONS_SHUTDOWN_TIMEOUT_SECONDS:-10}"
      PHASE8_OPTIONS_SNAPSHOT_RETENTION_DAYS: "${PHASE8_OPTIONS_SNAPSHOT_RETENTION_DAYS:-7}"
      PHASE8_OPTIONS_CONTEXT_RETENTION_DAYS: "${PHASE8_OPTIONS_CONTEXT_RETENTION_DAYS:-30}"
      PHASE8_OPTIONS_LIFECYCLE_RETENTION_DAYS: "${PHASE8_OPTIONS_LIFECYCLE_RETENTION_DAYS:-90}"
      PHASE8_OPTIONS_RETENTION_ENFORCEMENT: "${PHASE8_OPTIONS_RETENTION_ENFORCEMENT:-0}"
      PHASE8_OPTIONS_RETENTION_DELETE_BATCH_ROWS: "${PHASE8_OPTIONS_RETENTION_DELETE_BATCH_ROWS:-1000}"
      PHASE8_OPTIONS_CHAIN_STALE_AFTER_SECONDS: "${PHASE8_OPTIONS_CHAIN_STALE_AFTER_SECONDS:-5400}"
      PHASE8_OPTIONS_TICKER_STALE_AFTER_SECONDS: "${PHASE8_OPTIONS_TICKER_STALE_AFTER_SECONDS:-300}"
      PHASE8_OPTIONS_MARKPRICE_STALE_AFTER_SECONDS: "${PHASE8_OPTIONS_MARKPRICE_STALE_AFTER_SECONDS:-900}"
      PHASE8_OPTIONS_CATALOG_STALE_AFTER_SECONDS: "${PHASE8_OPTIONS_CATALOG_STALE_AFTER_SECONDS:-93600}"
      PHASE8_OPTIONS_LIFECYCLE_STALE_AFTER_SECONDS: "${PHASE8_OPTIONS_LIFECYCLE_STALE_AFTER_SECONDS:-60}"
      PHASE8_OPTIONS_MAX_SOURCE_SKEW_SECONDS: "${PHASE8_OPTIONS_MAX_SOURCE_SKEW_SECONDS:-5400}"
      PHASE8_OPTIONS_MIN_CHAIN_COVERAGE: "${PHASE8_OPTIONS_MIN_CHAIN_COVERAGE:-0.95}"
      PHASE8_OPTIONS_MIN_TICKER_COVERAGE: "${PHASE8_OPTIONS_MIN_TICKER_COVERAGE:-0.90}"
      PHASE8_OPTIONS_CONCENTRATION_TOP_N: "${PHASE8_OPTIONS_CONCENTRATION_TOP_N:-20}"
      PHASE8_OPTIONS_SKEW_MIN_CONTRACTS: "${PHASE8_OPTIONS_SKEW_MIN_CONTRACTS:-6}"
      PHASE8_OPTIONS_SKEW_MIN_DISTINCT_STRIKES: "${PHASE8_OPTIONS_SKEW_MIN_DISTINCT_STRIKES:-3}"
      PHASE8_OPTIONS_RR_DELTA_TOLERANCE: "${PHASE8_OPTIONS_RR_DELTA_TOLERANCE:-}"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://quant:quant@postgres:5432/quant}
    volumes:
      - ./phase7-config:/run/quant-phase7-config:ro
    mem_limit: 768m
    restart: unless-stopped

  quant-engine:
    container_name: quant-engine
    image: ${QUANT_IMAGE_TAG:-quant-phase7:phase6-local}
    environment:
      TRADING_MODE: paper
      PHASE2_ENABLED: "1"
      PHASE3_ENABLED: "1"
      PHASE4_ENABLED: "1"
      PHASE5_ENABLED: "1"
      PHASE6_ENABLED: "1"
      PHASE6_AI_QUEUE_CAPACITY: "32"
      PHASE6_AI_CONCURRENCY: "2"
      PHASE6_AI_RETRY_INTERVAL_SECONDS: "300"
      PHASE9_ENABLED: "${PHASE9_ENABLED:-0}"
      PHASE9_MAX_INFLIGHT_EVALUATIONS: "${PHASE9_MAX_INFLIGHT_EVALUATIONS:-2}"
      PHASE9_MAX_QUEUED_IDS: "${PHASE9_MAX_QUEUED_IDS:-32}"
      PHASE9_MAX_QUEUED_BYTES: "${PHASE9_MAX_QUEUED_BYTES:-8388608}"
      PHASE9_EVALUATION_TIMEOUT_SECONDS: "${PHASE9_EVALUATION_TIMEOUT_SECONDS:-30}"
      PHASE9_MAX_CONCURRENT_JEV_CALLS: "${PHASE9_MAX_CONCURRENT_JEV_CALLS:-1}"
      PHASE9_MAX_REVALIDATIONS_PER_MINUTE: "${PHASE9_MAX_REVALIDATIONS_PER_MINUTE:-16}"
      PHASE9_POLICY_MANIFEST_PATH: /app/policies/phase9_policy_v1.json
      PHASE9_POLICY_APPROVAL_PATH: /app/policies/phase9_policy_v1.approval.json
      PHASE9_CODE_VERSION: "${PHASE9_CODE_VERSION:-}"
      PHASE7_ENABLED: "${PHASE7_ENABLED:-0}"
      PHASE7_CONTEXT_INTERVAL_SECONDS: "${PHASE7_CONTEXT_INTERVAL_SECONDS:-60}"
      PHASE7_CONTEXT_LOOKBACK_HOURS: "${PHASE7_CONTEXT_LOOKBACK_HOURS:-4}"
      PHASE7_CONTEXT_WINDOW_BATCH: "${PHASE7_CONTEXT_WINDOW_BATCH:-16}"
      PHASE7_ADDRESS_LABELS_PATH: "${PHASE7_ADDRESS_LABELS_PATH:-}"
      PHASE7_WHALE_THRESHOLDS_PATH: "${PHASE7_WHALE_THRESHOLDS_PATH:-}"
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://quant:quant@postgres:5432/quant}
    volumes:
      - ./phase7-config:/run/quant-phase7-config:ro
      - ./policies:/app/policies:ro
    mem_limit: 512m
    restart: unless-stopped
  quant-migrate:
    profiles: ["maintenance"]
    image: ${QUANT_IMAGE_TAG:-quant-phase7:phase6-local}
    command: ["python", "scripts/phase9_migrate.py"]
    environment:
      QUANT_MIGRATION_DSN: ${QUANT_MIGRATION_DSN:-}
    depends_on:
      - postgres
    mem_limit: 128m
    restart: "no"

volumes:
  quant_local_pgdata:
